openapi: 3.1.0
info:
  title: PhotoFlow API
  description: PhotoFlow API
  version: 1.0.0
servers:
  - url: "http://localhost:8080"
tags:
  - name: Pipelines

paths:
  /api/v1/pipelines:
    get:
      tags: [Pipelines]
      summary: Get all pipelines
      operationId: getAllPipelines
      responses:
        "200":
          description: List of pipelines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Pipelines]
      summary: Create a pipeline
      operationId: createPipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePipelineRequest"
      responses:
        "201":
          description: Pipeline created
          headers:
            Location:
              description: URI of the created pipeline
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "400":
          description: Invalid request (blank name, malformed JSON)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A pipeline with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/pipelines/{id}:
    get:
      tags: [Pipelines]
      summary: Get a pipeline by ID
      operationId: getPipelineById
      parameters:
        - name: id
          in: path
          required: true
          description: Pipeline identifier
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Pipeline found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "400":
          description: Pipeline ID is not an integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pipeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    CreatePipelineRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Unique pipeline name
          minLength: 1
          example: Resize and watermark
    PipelineResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int32
          description: Pipeline identifier generated by the server
          example: 1
        name:
          type: string
          description: Pipeline name
          example: Resize and watermark
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable error message
          example: Pipeline with id=42 not found
  responses:
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
